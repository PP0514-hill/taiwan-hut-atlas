# 每日從 Notion 拉資料，有變更才提交；提交後由 deploy.yml 建置發布
name: sync-notion
on:
  schedule:
    - cron: '17 21 * * *'   # UTC 21:17 ＝ 台北 05:17
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/fetch-notion.mjs
      - name: Validate
        run: node scripts/check-data.mjs
      - name: Commit if changed, then trigger deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "hut-atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          # 只加公開檔；data/*.internal.* 已 gitignore，用萬用字元會讓 git add 報錯
          git add data/agencies.json data/trails.json data/huts.json data/events.json data/sources.json data/meta.json data/huts.public.geojson
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "data: notion sync $(date -u +%F)"
            git push
            # GITHUB_TOKEN 的 push 不會觸發其他 workflow，需手動喚起 deploy
            gh workflow run deploy.yml --ref main
          fi

# 每日從 Notion 拉資料，有變更才提交；提交後由 deploy.yml 建置發布
name: sync-notion
on:
  schedule:
    - cron: '17 21 * * *'   # UTC 21:17 ＝ 台北 05:17
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Fetch from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: node scripts/fetch-notion.mjs
      - name: Validate
        run: node scripts/check-data.mjs
      - name: Commit if changed
        run: |
          git config user.name "hut-atlas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json data/*.public.geojson
          git diff --cached --quiet && echo "no change" || git commit -m "data: notion sync $(date -u +%F)" && git push
